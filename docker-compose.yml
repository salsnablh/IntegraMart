services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: integramart-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - integramart

  nginx:
    image: nginx:1.27-alpine
    container_name: integramart-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - integramart

  mysql:
    image: mysql:8.4
    container_name: integramart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: integramart
      MYSQL_USER: integramart
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - integramart

  redis:
    image: redis:7.4-alpine
    container_name: integramart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - integramart

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: integramart-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: integramart
      MINIO_ROOT_PASSWORD: integramart-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - integramart

networks:
  integramart:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
